defaults:
  - evaluate
  - _self_
# Full-period profile: train from 2006, test 2016-2025 (valid is the year before each test year).
# Pass processed_root, datamart_path and datamart_manifest_sha256 with --override.
processed_root: ???
train_start_year: 2006
test_years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
# all_columns holds the 44 closed numeric columns; without_added_columns equals the original
# 36 columns in their original order. The other variants leave one added group out (ADR-051).
variants:
  - name: all_columns
    excluded_columns: []
  - name: without_market
    excluded_columns: [market_characteristics__market_win_odds]
  - name: without_added_columns
    excluded_columns:
      - basic_conditions_and_weight__gate_number
      - basic_conditions_and_weight__frozen_field_size
      - basic_conditions_and_weight__horse_age_years
      - recent_performance__past_top3_rate
      - past_racing_ability__past_signed_gap_sec_lag1
      - past_racing_ability__past_signed_gap_sec_lag2
      - past_racing_ability__past_signed_gap_sec_lag3
      - past_racing_ability__past_signed_gap_sec_lag4
  - name: without_post_position
    excluded_columns:
      - basic_conditions_and_weight__gate_number
      - basic_conditions_and_weight__frozen_field_size
  - name: without_horse_age
    excluded_columns: [basic_conditions_and_weight__horse_age_years]
  - name: without_signed_gap
    excluded_columns:
      - past_racing_ability__past_signed_gap_sec_lag1
      - past_racing_ability__past_signed_gap_sec_lag2
      - past_racing_ability__past_signed_gap_sec_lag3
      - past_racing_ability__past_signed_gap_sec_lag4
  - name: without_top3_rate
    excluded_columns: [recent_performance__past_top3_rate]
lightgbm:
  learning_rate: 0.05
  num_leaves: 31
  min_data_in_leaf: 100
  feature_fraction: 0.9
  lambda_l2: 1.0
  num_threads: 8
  seed: 0
  deterministic: true
  force_col_wise: true
num_boost_round: 3000
early_stopping_rounds: 100
temperature_bounds: [0.05, 20.0]
probability_chunk_races: 256
bootstrap:
  resamples: 2000
  seed: 0
  confidence: 0.95
probability_bands: [0.0, 0.01, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5, 1.0]
odds_bands: [1.0, 2.0, 3.0, 5.0, 10.0, 20.0, 50.0, 100.0]

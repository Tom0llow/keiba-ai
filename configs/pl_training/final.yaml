defaults:
  - train
  - _self_
# Operational profile: train 2006-2024, early-stop and calibrate on 2025, with the market
# column (all_columns). LightGBM settings, rounds and temperature bounds equal
# configs/pl_evaluation/measure.yaml. Pass datamart_path and datamart_manifest_sha256 with
# --override.
train_start_year: 2006
valid_year: 2025
variant:
  name: all_columns
  excluded_columns: []
lightgbm:
  learning_rate: 0.05
  num_leaves: 31
  min_data_in_leaf: 100
  feature_fraction: 0.9
  lambda_l2: 1.0
  num_threads: 8
  seed: 0
  deterministic: true
  force_col_wise: true
num_boost_round: 3000
early_stopping_rounds: 100
temperature_bounds: [0.05, 20.0]

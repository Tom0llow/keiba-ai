[jvlink]
executable = "C:/JVLinkToSQLite/JVLinkToSQLite.exe"
seed_setting = "C:/JVLinkToSQLite/setting.xml"

# Optional target race for `--retrieve --mode=realtime`.
# [realtime]
# date = 2026-10-04
# jyo = "05"
# kaiji = "04"
# nichiji = "08"
# race = "11"

[historical]
normal_update = false
setup_update = true
realtime_update = false
normal_data_specs = []
setup_data_specs = [
  "RACE",
  "DIFF",
  "BLOD",
  "SNAP",
  "SLOP",
  "WOOD",
  "YSCH",
  "HOSE",
  "HOYU",
  "COMM",
  "MING",
  "DIFN",
  "BLDN",
  "SNPN",
  "HOSN",
]
realtime_data_specs = []

[historical.start_datetimes]
RACE = 1986-01-01T00:00:00
DIFF = 1986-01-01T00:00:00
BLOD = 1986-01-01T00:00:00
SNAP = 2004-01-01T00:00:00
SLOP = 2003-01-01T00:00:00
WOOD = 2021-07-27T00:00:00
YSCH = 2000-01-01T00:00:00
HOSE = 1997-01-01T00:00:00
HOYU = 2000-01-01T00:00:00
COMM = 1986-01-01T00:00:00
MING = 2001-09-01T00:00:00
DIFN = 2023-08-08T00:00:00
BLDN = 2023-08-08T00:00:00
SNPN = 2004-01-01T00:00:00
HOSN = 2023-08-08T00:00:00

[historical_odds]
normal_update = false
setup_update = false
realtime_update = true
normal_data_specs = []
setup_data_specs = []
realtime_data_specs = ["0B41", "0B42"]
race_start_date = 2003-10-04
skip_existing = true

[historical_odds.batch]
first_year = 2003
last_year = 2026
years_per_run = 1

[latest]
normal_update = true
setup_update = false
realtime_update = true
# SLOP/WOOD/DIFN keep the race-day workouts and horse master fresh for the
# label-free reference features (ADR-040).
normal_data_specs = ["RACE", "SLOP", "WOOD", "DIFN"]
setup_data_specs = []
realtime_data_specs = ["0B12", "0B15", "0B11", "0B14", "0B13", "0B17"]

# Lower bounds of the persisted normal read positions (ADR-040). A position before
# its floor is raised to it; a later one is kept. Keep each floor at or before the
# last historical-basic setup retrieval of that data spec.
[latest.normal_start_floors]
SLOP = 2026-10-01T00:00:00
WOOD = 2026-10-01T00:00:00
DIFN = 2026-10-01T00:00:00

[realtime_history]
normal_update = false
setup_update = false
realtime_update = true
normal_data_specs = []
setup_data_specs = []
realtime_data_specs = ["0B41", "0B42"]

[realtime_current]
normal_update = false
setup_update = false
realtime_update = true
normal_data_specs = []
setup_data_specs = []
realtime_data_specs = ["0B31", "0B32"]

[race_day_odds]
normal_update = false
setup_update = false
realtime_update = true
normal_data_specs = []
setup_data_specs = []
realtime_data_specs = ["0B31", "0B32", "0B33", "0B34", "0B35", "0B36"]
offsets_minutes = [30, 10, 5, 2]
late_tolerance_seconds = 60
execution_timeout_seconds = 120
# Minutes before the start of each race's 0B41/0B42 prediction fetch (ADR-032
# Amendment 2). Loading rejects values outside 3-5: the fetch must start at or after the
# reference freeze (5, ADR-037) and leave time to calculate before sales close (2).
prediction_offset_minutes = 5

name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-targets:
    name: Format targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/data-retriever

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Install dependencies
        run: uv sync --locked

      - name: Format targets
        run: |
          uv run ruff format \
            src/data/data_retriever.py \
            src/data/loader/read_parquet.py \
            src/data/preprocesser/read_sqlite.py \
            src/data/race_key.py \
            src/tests/test_data_pipeline.py

      - name: Commit formatted targets
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/data_retriever.py src/data/loader/read_parquet.py src/data/preprocesser/read_sqlite.py src/data/race_key.py src/tests/test_data_pipeline.py
          git commit -m "style(data): apply Ruff formatting"
          git push origin HEAD:feat/data-retriever

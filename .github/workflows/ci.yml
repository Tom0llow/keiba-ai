name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-target:
    name: Format target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/data-retriever

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Install dependencies
        run: uv sync --locked

      - name: Format target
        run: uv run ruff format src/tests/test_odds_archive.py

      - name: Commit formatted target
        shell: bash
        run: |
          if git diff --quiet -- src/tests/test_odds_archive.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests/test_odds_archive.py
          git commit -m "style(test): apply Ruff formatting"
          git push origin HEAD:feat/data-retriever

# Project-local Codex configuration.
#
# Codex is the implementer in the Claude-led task lifecycle
# (docs/rules/agent-collaboration.md). It edits files and runs local
# validation only:
# - shell commands stay inside the workspace-write sandbox with networking off;
# - Git mutations, GitHub CLI, and nested Codex runs are forbidden by
#   .codex/rules/default.rules;
# - commits, pushes, and PRs are made by Claude Code with the GitHub App
#   identity, and only a human can merge main.
#
# Claude Code launches task runs with `codex exec` in `.worktrees/<task-id>/`
# and passes the equivalent sandbox settings explicitly, because this project
# file applies only to trusted project paths.

approval_policy = "on-request"
approvals_reviewer = "user"

sandbox_mode = "workspace-write"
web_search = "live"

project_doc_max_bytes = 32768
project_doc_fallback_filenames = []

[sandbox_workspace_write]
network_access = false
writable_roots = []

[windows]
sandbox = "unelevated"

[shell_environment_policy]
inherit = "all"

# Keep KEY / SECRET / TOKEN variables out of ordinary Codex subprocesses.
ignore_default_excludes = false

[history]
persistence = "save-all"
